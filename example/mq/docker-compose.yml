# example/mq —— 消息队列 Demo 总索引
#
# 包含两套服务（dev 单节点 + production 3 节点 profile）：
#   1. RabbitMQ 4.x（带 Management UI + Prometheus）
#   2. Kafka 4.x KRaft 模式（无 Zookeeper）
#
# 对应笔记：
#   - [[01_RabbitMQ笔记]]
#   - [[02_Kafka笔记]]
#   - [[消息队列选型对比笔记]]

version: "3.9"

# ============================================================
# 默认 profile = 单节点 dev（轻量，CI/本地）
#   docker compose --profile dev up -d
# ============================================================

x-rabbit-common: &rabbit-common
  image: rabbitmq:4-management
  environment:
    RABBITMQ_DEFAULT_USER: admin
    RABBITMQ_DEFAULT_PASS: admin

x-kafka-common: &kafka-common
  image: apache/kafka:4.0.0
  environment:
    KAFKA_CFG_NODE_ID: "1"
    KAFKA_CFG_PROCESS_ROLES: "broker,controller"
    KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
    KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
    KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

services:
  # ==========================================================
  # dev profile：单节点
  # ==========================================================
  rabbitmq:
    <<: *rabbit-common
    container_name: rabbitmq-dev
    profiles: ["dev"]
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
      - "15692:15692"    # Prometheus metrics
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  kafka:
    <<: *kafka-common
    container_name: kafka-dev
    profiles: ["dev"]
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ==========================================================
  # production profile：3 节点集群（参考用）
  #
  # 启动：
  #   docker compose --profile prod up -d
  #
  # 包含：
  #   - RabbitMQ 3 节点 Quorum 集群（需共享 erlang cookie + 节点发现）
  #   - Kafka 3 节点 KRaft 集群（broker+controller 混合，仅 demo 用）
  #     生产推荐 3 controller + N broker 分离部署
  # ==========================================================
  rabbitmq-1:
    <<: *rabbit-common
    container_name: rabbitmq-1
    profiles: ["prod"]
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_ERLANG_COOKIE: "secret-cookie"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq

  rabbitmq-2:
    <<: *rabbit-common
    container_name: rabbitmq-2
    profiles: ["prod"]
    hostname: rabbitmq-2
    environment:
      RABBITMQ_ERLANG_COOKIE: "secret-cookie"
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    depends_on:
      - rabbitmq-1

  rabbitmq-3:
    <<: *rabbit-common
    container_name: rabbitmq-3
    profiles: ["prod"]
    hostname: rabbitmq-3
    environment:
      RABBITMQ_ERLANG_COOKIE: "secret-cookie"
    volumes:
      - rabbitmq3_data:/var/lib/rabbitmq
    depends_on:
      - rabbitmq-1

  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    profiles: ["prod"]
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    profiles: ["prod"]
    hostname: kafka-2
    environment:
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    profiles: ["prod"]
    hostname: kafka-3
    environment:
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
    volumes:
      - kafka3_data:/var/lib/kafka/data

volumes:
  rabbitmq_data:
  rabbitmq1_data:
  rabbitmq2_data:
  rabbitmq3_data:
  kafka_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:

# ============================================================
# 启动方式
#
# dev（单节点，推荐本地/CI）：
#   docker compose --profile dev up -d
#   # RabbitMQ UI: http://localhost:15672 (admin/admin)
#   # Kafka: localhost:9092
#
# prod（3 节点集群，参考用）：
#   docker compose --profile prod up -d
#   # 注意：production 集群需要在 RMQ 容器内执行集群 join
#   # docker exec rabbitmq-2 rabbitmqctl join_cluster rabbit@rabbitmq-1
#   # docker exec rabbitmq-3 rabbitmqctl join_cluster rabbit@rabbitmq-1
#   # docker exec rabbitmq-1 rabbitmqctl set_policy HA ".*" '{"ha-mode":"all"}' --apply-to queues
#
# 停止：
#   docker compose --profile dev down
#   docker compose --profile prod down
#
# 查看日志：
#   docker compose logs -f rabbitmq
#   docker compose logs -f kafka
# ============================================================