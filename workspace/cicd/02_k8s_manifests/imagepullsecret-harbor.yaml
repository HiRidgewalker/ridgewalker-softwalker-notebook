# =============================================================================
# K8s imagePullSecret 创建方式（参考 / kubectl 命令）
# 对应：Hub/14_Harbor笔记.md 的 6.1
# =============================================================================
# 一般用 kubectl 命令创建，不写文件：
#
#   kubectl create namespace myapp
#   kubectl create secret docker-registry harbor-pull \
#     --docker-server=harbor.example.com \
#     --docker-username='robot$myproj+robot-ci' \
#     --docker-password='xxxxx' \
#     --docker-email=ci@example.com \
#     -n myapp
#
# 也可写为 Secret：
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: harbor-pull
  namespace: myapp
type: kubernetes.io/dockerconfigjson
data:
  # 由 dockerconfigjson(base64) 编码的 "auths":{"harbor.example.com":{"auth":"..."}}
  # 用 kubectl apply 之前先 kubectl create，按需替换
  .dockerconfigjson: eyJhdXRocyI6eyJoYXJib3IuZXhhbXBsZS5jb20iOnsidXNlcm5hbWUiOiJyb2JvdCRteXByb2orcG9ib3QtY2kiLCJwYXNzd29yZCI6Inh4eHh4In19fQ==
